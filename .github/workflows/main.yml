name: CI/CD PIPELINE (BACKEND)

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PORT: 3333
      DATABASE_URL: postgresql://test:test@localhost:5432/bookstore_test
      DATABASE_TEST_URL: postgresql://test:test@localhost:5432/bookstore_test
      JWT_SECRET: muchmuchmuchsupersecretwith32characteres
      JWT_EXPIRES: 10m
      JWT_REFRESH_SECRET: muchmuchmuchsupersecretwith32characteres
      JWT_REFRESH_EXPIRES: 10m
      SALT: 5
      ADMIN_EMAIL: admin@admin.com
      ADMIN_PASSWORD: adminadminadmin
      ADMIN_NAME: admin
      ALLOWED_ORIGINS: "[]"
      CLOUDINARY_CLOUD_NAME: muchmuchmuchsupersecretwith32characteres
      CLOUDINARY_API_KEY: muchmuchmuchsupersecretwith32characteres
      CLOUDINARY_API_SECRET: muchmuchmuchsupersecretwith32characteres
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bookstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ./backend/package-lock.json

      - working-directory: ./backend
        run: npm ci

      - name: Lint
        working-directory: ./backend
        run: npx eslint .

      - name: Generate prisma client
        working-directory: ./backend
        run: npx prisma generate

      - name: Migrate prisma
        working-directory: ./backend
        run: npx prisma db push --accept-data-loss

      - name: Run vitest with coverage
        working-directory: ./backend
        run: npx vitest run --coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run BUILD
        working-directory: ./backend
        run: npx tsc
